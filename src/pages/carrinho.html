<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/imgs/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/carrinho.css">
    <title> Mix Bite </title>
</head>
<body>
    <!-- CABEÇALHO -->
    <header class="container-header">
        <div class="logo">
            <img src="../../assets/imgs/logo.svg" alt="Logo do Restaurante MixBite">
        </div>
        <nav class="nav-menu">
            <a href="#container-apresentation"><img src="../../assets/imgs/iconhome.svg" alt="Ícone de Home"></a>
            <a href="src/pages/menu.html"><img src="../../assets/imgs/iconorder.svg" alt="Ícone de Pedido"></a>
            <a href="src/pages/carrinho.html"><img src="../../assets/imgs/iconcaramarelo.svg" alt="Ícone de carrinho"></a>
        </nav>
    </header>

    <!-- CARRINHO -->
    <main> 
        <section class="container-carrinho">
            <div class="carrinho-content">
                <h1> Carrinho </h1>
                    <div class="cabecalho"> 
                        <h3> Quantidade </h3>
                        <h3> Produto </h3>
                        <h3> Reais </h3>
                    </div>
                    <div class="dados">
                        <h3> 01 </h3>  
                        <h3> Pizza de Calabresa </h3>
                        <h3> 30,00 </h3>               
                    </div>
                        <p> Para editar o seu pedido, volte para a página anterior </p>
                    <div class="restart-pay">
                            <p id="restart" alt="Reiniciar Pedido"> Reiniciar Pedido </p>
                            <p id="pay" alt="Pagar pedido"> Pagar </p>
                    </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <section id="container-footer">
            <div class="footer-content">
                <div class="imagem-descricao-footer">
                    <img src="../../assets/imgs/logo.svg" alt="Logo do restaurante do footer">
                        <h2> MixBite, uma mistura de sabores! </h2>
                </div>
                <div class="container-developers">
                    <h2> Desenvolvido por: </h2>
                        <div class="developers">
                            <p> Arthur Kauã </p>
                            <p> Andrew Rafael </p>
                            <p> Marcus Paulo </p>
                        </div>
                </div>
            </div>
        </section>
    </footer>

</body>
</html>
